/* ---------- motion field (grid over the poster) ---------- */
const GW=48,GH=68,GN=GW*GH;
const RV=new Float32Array(GN),F=new Float32Array(GN),Fb=new Float32Array(GN),GX=new Float32Array(GN),GY=new Float32Array(GN);
dbg.width=GW; dbg.height=GH;
const dimg=dctx.createImageData(GW,GH);
function splat(ux,uy,r,amt,A=F){            // ux,uy in poster units
  const gx=ux/W*GW,gy=uy/H*GH,rr=r*r;
  const x0=Math.max(0,Math.floor(gx-r*2)),x1=Math.min(GW-1,Math.ceil(gx+r*2));
  const y0=Math.max(0,Math.floor(gy-r*2)),y1=Math.min(GH-1,Math.ceil(gy+r*2));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const dx=x+.5-gx,dy=y+.5-gy;A[y*GW+x]+=amt*Math.exp(-(dx*dx+dy*dy)/rr);
  }
}

/* ---------- camera ---------- */
const video=document.getElementById("v"),status=document.getElementById("status"),start=document.getElementById("start");
const cc=document.createElement("canvas");cc.width=GW;cc.height=GH;
const cctx=cc.getContext("2d",{willReadFrequently:true});
let prevL=null,camOn=false,stream=null,sens=1;
let vm=1;   // 0 off · 1 hands only · 2 faint body + hands
const TW=200,TH=283,tc=document.createElement("canvas");tc.width=TW;tc.height=TH;
const tctx=tc.getContext("2d",{willReadFrequently:true});
let hideT=0;
function say(t,ms=4000){status.textContent=t;status.classList.remove("hide");clearTimeout(hideT);if(ms)hideT=setTimeout(()=>status.classList.add("hide"),ms)}
async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:320},height:{ideal:240},facingMode:"user"},audio:false});
    video.srcObject=stream; await video.play(); camOn=true; prevL=null; start.classList.remove("on");
    if(!pose.on&&!pose.loading){pose.loading=true;pose.init()}
    say("카메라 반응 중 — 움직이면 물고기가 흩어집니다\n[V] 웹캠 표현  [C] 카메라  [D] 모션 보기  [ / ] 감도  [F] 전체화면");
  }catch(e){
    camOn=false;
    say("카메라를 쓸 수 없어 마우스·터치로 반응합니다\n화면을 클릭하면 카메라를 다시 시도합니다",7000);
  }
}
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;camOn=false;say("카메라 끔 — 마우스·터치 모드")}
function readCam(){
  if(!camOn||video.readyState<2)return;
  const vw=video.videoWidth,vh=video.videoHeight; if(!vw)return;
  // cover-crop video into the poster aspect, mirrored
  let sw=vh*GW/GH,sh=vh; if(sw>vw){sw=vw;sh=vw*GH/GW}
  const sx=(vw-sw)/2,sy=(vh-sh)/2;
  cctx.setTransform(-1,0,0,1,GW,0);
  cctx.drawImage(video,sx,sy,sw,sh,0,0,GW,GH);
  const d=cctx.getImageData(0,0,GW,GH).data;
  const L=new Float32Array(GN);
  for(let i=0;i<GN;i++)L[i]=d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114;
  if(prevL){
    const th=14/sens;
    const g=(pose.on?0:0.55)*sens;   // joints take over when a body is tracked; diff stays as a soft ripple
    for(let i=0;i<GN;i++){const df=Math.abs(L[i]-prevL[i])-th; if(df>0)F[i]+=Math.min(df/55,1.4)*g}
  }
  prevL=L;
}

// landmark index → [radius (poster units), resting presence]
// fingertips only (MediaPipe Hands): thumb, index, middle, ring, pinky → [radius, resting presence]
const JOINTS={4:[4.5,.10],8:[5.5,.14],12:[4.5,.10],16:[4,.08],20:[4,.08]};
const pose={on:false,people:0,lm:null,lastVT:-1,st:new Map(),
  async init(){
    try{
      if(typeof window.dbg!=="function")window.dbg=()=>{};   // MediaPipe 0.10.14 wasm calls a global dbg()
      const vis=await import(MP+"/vision_bundle.mjs");
      const fs=await vis.FilesetResolver.forVisionTasks(MP+"/wasm");
      const opts=d=>({baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:"VIDEO",numHands:4,
        minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5});
      try{this.lm=await vis.HandLandmarker.createFromOptions(fs,opts("GPU"))}
      catch(e){this.lm=await vis.HandLandmarker.createFromOptions(fs,opts("CPU"))}
      this.on=true; say("손끝 추적 켜짐 — 손가락 끝에만 반응합니다",3500);
    }catch(e){console.warn("pose unavailable",e); say("손 추적을 불러오지 못해 화면 움직임 감지로 반응합니다",5000)}
  },
  update(now,dt){
    if(video.readyState<2||video.currentTime===this.lastVT){this.emit(dt,false);return}
    this.lastVT=video.currentTime;
    let res; try{res=this.lm.detectForVideo(video,now)}catch(e){return}
    const vw=video.videoWidth,vh=video.videoHeight;
    let sw=vh*W/H,sh=vh; if(sw>vw){sw=vw;sh=vw*H/W}
    const sx=(vw-sw)/2,sy=(vh-sh)/2;
    const seen=new Set(); this.people=res.landmarks.length;
    res.landmarks.forEach((L,pi)=>{
      for(const id in JOINTS){
        const p=L[id]; if(!p)continue;
        const x=(1-(p.x*vw-sx)/sw)*W, y=(p.y*vh-sy)/sh*H;   // mirrored, same crop as the image
        const key=pi+":"+id; seen.add(key);
        let s=this.st.get(key);
        if(!s){s={x,y,vx:0,vy:0,t:now};this.st.set(key,s);continue}
        const ddt=Math.max(.016,(now-s.t)/1000);
        // light smoothing: keeps fingertips sharp, removes jitter
        const nx=s.x+(x-s.x)*.65, ny=s.y+(y-s.y)*.65;
        s.vx+=((nx-s.x)/ddt-s.vx)*.5; s.vy+=((ny-s.y)/ddt-s.vy)*.5;
        s.x=nx; s.y=ny; s.t=now; s.id=+id; s.fresh=1;
      }
    });
    for(const k of [...this.st.keys()])if(!seen.has(k))this.st.delete(k);
    this.emit(dt,true);
  },
  emit(dt,fresh){
    for(const s of this.st.values()){
      if(!fresh){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.9;s.vy*=.9}   // glide between camera frames
      const [r,base]=JOINTS[s.id]; const sp=Math.hypot(s.vx,s.vy);
      agents.push({x:s.x,y:s.y,vx:s.vx,vy:s.vy,r,s:base+Math.min(Math.max(0,sp-5)/70,1.8)*sens});
    }
  }
};

/* ---------- pointer (fallback / also active with camera) ---------- */
let ptr=null,lastPtr=null; const ptrV={x:0,y:0};
function toPoster(e){const r=poster.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
addEventListener("pointermove",e=>{ptr=toPoster(e);ptr.t=performance.now()});
addEventListener("pointerdown",e=>{ptr=toPoster(e);ptr.t=performance.now();ptr.down=true;if(!camOn&&navigator.mediaDevices)startCam()});
addEventListener("pointerup",()=>{if(ptr)ptr.down=false});
addEventListener("pointerleave",()=>{ptr=null;lastPtr=null;ptrV.x=ptrV.y=0});

// exhibition helpers: double-click = fullscreen, hide idle cursor, keep the screen awake
addEventListener("dblclick",()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})});
if(KIOSK){
  let idleT=0; const wake=()=>{document.body.classList.remove("idle");clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add("idle"),2000)};
  addEventListener("pointermove",wake); wake();
  let lock=null; const keepAwake=async()=>{try{if(!lock&&document.visibilityState==="visible"){lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>lock=null)}}catch(e){}};
  keepAwake(); document.addEventListener("visibilitychange",keepAwake); addEventListener("pointerdown",keepAwake);
}
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k==="d")dbg.classList.toggle("on");
  else if(k==="c")camOn?stopCam():startCam();
  else if(k==="f"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
  else if(k==="]"){sens=Math.min(3,sens*1.2);say("감도 "+sens.toFixed(2),1500)}
  else if(k==="["){sens=Math.max(.3,sens/1.2);say("감도 "+sens.toFixed(2),1500)}
  else if(k==="h")status.classList.toggle("hide");
  else if(k==="v"){vm=(vm+1)%3;say("웹캠 표현: "+["끔","손끝만","전신 옅게 + 손끝"][vm],1800)}
});

/* ---------- simulation ---------- */
let last=performance.now(),T=0;
function step(now){
  let dt=Math.min(.05,(now-last)/1000); last=now; T+=dt;

  // field: decay, sources, blur, gradient
  const dec=Math.exp(-dt*3.2);
  for(let i=0;i<GN;i++)F[i]*=dec;
  readCam();
  // precise point "hands": the pointer and every tracked body joint
  agents.length=0;
  if(ptr&&now-ptr.t<4000){
    let pvx=0,pvy=0; if(lastPtr){pvx=(ptr.x-lastPtr.x)/Math.max(dt,1e-3);pvy=(ptr.y-lastPtr.y)/Math.max(dt,1e-3)}
    ptrV.x+=(pvx-ptrV.x)*.5; ptrV.y+=(pvy-ptrV.y)*.5;
    const sp=Math.hypot(ptrV.x,ptrV.y);
    agents.push({x:ptr.x,y:ptr.y,vx:ptrV.x,vy:ptrV.y,r:ptr.down?13:9,s:0.25+Math.min(sp/90,1.8)});
    lastPtr={x:ptr.x,y:ptr.y};
  }
  if(pose.on&&camOn)pose.update(now,dt);
  { const rd=Math.exp(-dt*2.5); for(let i=0;i<GN;i++)RV[i]*=rd;
    for(const A of agents)splat(A.x,A.y,Math.max(.9,A.r/W*GW*1.1),Math.max(.45,Math.min(A.s,1.5))*dt*6,RV) }
  for(let i=0;i<GN;i++)if(F[i]>3)F[i]=3;
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    let s=0,c=0;
    for(let j=-1;j<=1;j++){const yy=y+j;if(yy<0||yy>=GH)continue;
      for(let k=-1;k<=1;k++){const xx=x+k;if(xx<0||xx>=GW)continue;s+=F[yy*GW+xx];c++}}
    Fb[y*GW+x]=s/c;
  }
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const i=y*GW+x;
    GX[i]=Fb[y*GW+Math.min(GW-1,x+1)]-Fb[y*GW+Math.max(0,x-1)];
    GY[i]=Fb[Math.min(GH-1,y+1)*GW+x]-Fb[Math.max(0,y-1)*GW+x];
  }

  // fish
  const damp=Math.exp(-dt*3.4);
  for(let i=0;i<N;i++){
    let x=px[i],y=py[i];
    const gx=Math.min(GW-1,Math.max(0,(x/W*GW)|0)),gy=Math.min(GH-1,Math.max(0,(y/H*GH)|0)),gi=gy*GW+gx;
    const f=Fb[gi];
    const h=ha[i],hc=Math.cos(h),hs_=Math.sin(h);
    // idle: drift gently forward/back along own heading
    const sw=Math.sin(T*om[i]+ph[i]);
    const tx=hx[i]-hc*sw*0.45, ty=hy[i]-hs_*sw*0.45;
    let ax=0,ay=0,wsum=0;
    for(let j=0;j<agents.length;j++){
      const A=agents[j],dx=x-A.x,dy=y-A.y,d2=dx*dx+dy*dy,R2=A.r*A.r;
      if(d2>R2*5)continue;
      const w=Math.exp(-d2/R2),d=Math.sqrt(d2)+1e-3;
      const a=w*A.s*520;
      ax+=dx/d*a+A.vx*w*2.2; ay+=dy/d*a+A.vy*w*2.2;   // push out + get dragged along by the gesture
      wsum+=w*A.s;
    }
    const k=26/(1+f*7+wsum*8);
    ax+=(tx-x)*k; ay+=(ty-y)*k;
    if(f>0.04){
      let dx=-GX[gi],dy=-GY[gi]; const gl=Math.hypot(dx,dy);
      if(gl>1e-4){dx/=gl;dy/=gl}else{dx=0;dy=0}
      // dart: mostly away from motion, partly forward along heading (−x local)
      dx=dx*0.8-hc*0.35; dy=dy*0.8-hs_*0.35;
      const a=Math.min(f,1.6)*420;
      ax+=dx*a; ay+=dy*a;
    }
    let nvx=(vx[i]+ax*dt)*damp, nvy=(vy[i]+ay*dt)*damp;
    const sp=Math.hypot(nvx,nvy); if(sp>110){nvx*=110/sp;nvy*=110/sp}
    vx[i]=nvx; vy[i]=nvy; px[i]=x+nvx*dt; py[i]=y+nvy*dt;
    // heading: face travel direction when fast, else home angle + tail wiggle
    const w=Math.min(1,sp/22);
    let target=h+Math.sin(T*om[i]*2.3+ph[i])*0.07;
    if(w>0.02){
      const va=Math.atan2(nvy,nvx)+Math.PI;
      let d=va-target; d=Math.atan2(Math.sin(d),Math.cos(d)); target+=d*w;
    }
    let d=target-an[i]; d=Math.atan2(Math.sin(d),Math.cos(d));
    an[i]+=d*Math.min(1,dt*9);
  }

  // draw
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
  // live mirror of the viewer, same crop as the motion grid so body and fish line up
  if(camOn&&vm>0&&video.readyState>=2&&video.videoWidth){
    // viewer printed in the poster's own ink: one blue, posterised like a riso layer.
    // white stays paper-white; a faint plate everywhere, stronger where you move.
    const vw=video.videoWidth,vh=video.videoHeight;
    let sw=vh*W/H,sh=vh; if(sw>vw){sw=vw;sh=vw*H/W}
    tctx.setTransform(-1,0,0,1,TW,0);
    tctx.drawImage(video,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,TW,TH);
    const img=tctx.getImageData(0,0,TW,TH),p=img.data;
    const base=vm===2?0.12:0, rev=0.38, useF=!pose.on;
    for(let y=0;y<TH;y++){
      const fy=(y+.5)/TH*GH-.5, y0=Math.max(0,Math.min(GH-1,fy|0)), y1=Math.min(GH-1,y0+1), ty=Math.max(0,Math.min(1,fy-y0));
      for(let x=0;x<TW;x++){
        const i=(y*TW+x)*4;
        const L=(p[i]*.299+p[i+1]*.587+p[i+2]*.114)/255;
        let t=Math.min(1,Math.max(0,(0.86-L)/0.62));   // ink amount
        t=Math.round(t*4)/4;                              // posterise: 5 tones
        let s=base;
        if(rev){
          const fx=(x+.5)/TW*GW-.5, x0=Math.max(0,Math.min(GW-1,fx|0)), x1=Math.min(GW-1,x0+1), tx=Math.max(0,Math.min(1,fx-x0));
          const a00=RV[y0*GW+x0]+(useF?Fb[y0*GW+x0]:0),a01=RV[y0*GW+x1]+(useF?Fb[y0*GW+x1]:0),a10=RV[y1*GW+x0]+(useF?Fb[y1*GW+x0]:0),a11=RV[y1*GW+x1]+(useF?Fb[y1*GW+x1]:0);
          const f=(a00*(1-tx)+a01*tx)*(1-ty)+(a10*(1-tx)+a11*tx)*ty;
          s+=Math.min(1,f*1.8)*rev;
        }
        p[i]=32;p[i+1]=174;p[i+2]=229;p[i+3]=Math.min(.36,t*s)*255;
      }
    }
    tctx.setTransform(1,0,0,1,0,0);
    tctx.putImageData(img,0,0);
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(tc,0,0,cv.width,cv.height);
  }
  const sc0=ppu/SR;
  for(let i=0;i<N;i++){
    const s=hs[i]*sc0,c=Math.cos(an[i])*s,n=Math.sin(an[i])*s;
    ctx.setTransform(c,n,-n,c,px[i]*ppu,py[i]*ppu);
    ctx.drawImage(sprite,-SOX,-SOY);
  }

  if(dbg.classList.contains("on")){
    const p=dimg.data;
    for(let i=0;i<GN;i++){const v=Math.min(255,Fb[i]*220);p[i*4]=255;p[i*4+1]=255-v;p[i*4+2]=255-v*.6;p[i*4+3]=255}
    dctx.putImageData(dimg,0,0);
    ctx.setTransform(1,0,0,1,0,0); ctx.strokeStyle="#e5203a"; ctx.lineWidth=1.5*dpr;
    for(const A of agents){ctx.beginPath();ctx.arc(A.x*ppu,A.y*ppu,A.r*ppu,0,6.283);ctx.stroke()}
  }
  requestAnimationFrame(step);
}
requestAnimationFrame(step);

if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)startCam();
else say("이 브라우저는 카메라를 지원하지 않아 마우스·터치로 반응합니다",7000);
})();
</script>
